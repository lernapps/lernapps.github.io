name: Preview

# A preview of the site for every pull request, at https://lernapps.net/pr-preview/pr-<number>/:
# commented on the pull request, updated on every push, removed when the pull request is closed.
# Banner and noindex; links stay inside the preview. Shared action in lernapps/tooling.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: lernapps/tooling/actions/site-preview@3a97735bef1e524a766b6517037bbb8ceaeaee87 # main
        with:
          site: /
