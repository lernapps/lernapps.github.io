name: Preview

# A preview of the site for every pull request, at https://lernapps.net/pr-preview/pr-<number>/:
# commented on the pull request, updated on every push, removed when the pull request is closed.
# It shares the gh-pages branch with pages.yml (main at the root). Previews carry a banner and noindex.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Pull requests from forks and from Dependabot get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    env:
      SITE_PATH_PREFIX: /pr-preview/pr-${{ github.event.pull_request.number }}/
      SITE_PREVIEW: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci && npm run build && node scripts/check.mjs _site
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: lernapps.net
          qr-code: false
          action: auto
