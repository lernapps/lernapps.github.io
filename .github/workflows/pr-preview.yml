name: Preview

# A preview of the site for every pull request, at https://lernapps.net/pr-preview/pr-<number>/:
# commented on the pull request, updated on every push, removed when the pull request is closed.
# Banner and noindex; links stay inside the preview. Shared action in lernapps/tooling.
# The change scope (lernapps/tooling changes.yml) gates it: no preview for a change of only the plan (.vibe/**);
# closing a pull request always removes its preview. The job `preview` always runs and reports the result, the
# check that never stays "Pending".
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@260e5bbc2ade73b1355243d238e26539d1296a05 # main
    with:
      tooling-ref: 260e5bbc2ade73b1355243d238e26539d1296a05 # the classifier of the same commit, and TOOLING_REF of the pre-push hook
    permissions:
      contents: read

  build:
    needs: changes
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token and cannot push to gh-pages.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.changes.outputs.site == 'true')
    steps:
      - uses: lernapps/tooling/actions/site-preview@260e5bbc2ade73b1355243d238e26539d1296a05 # main
        with:
          site: /

  preview: # always runs, fails when a job above failed or was cancelled
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
