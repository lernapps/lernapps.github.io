name: Abhängigkeiten

# Dependency Review auf jedem Pull Request (Harness-Rad: license-compliance, ADR-029): Neue oder geänderte
# Abhängigkeiten dürfen keine Lizenz außerhalb der dev-Allowlist aus lib/pruefe-lizenzen.js und keine
# Schwachstelle ab „high“ mitbringen (wie `npm audit --audit-level=high` in pruefen.yml).
# Kein Pflicht-Check; die volle Prüfung des Lockfiles läuft in `npm test` (test-und-build).
on:
  pull_request:

permissions:
  contents: read

jobs:
  abhaengigkeiten:
    runs-on: ubuntu-latest
    steps:
      # v5.0.0, per Commit-SHA gepinnt (T-012). Update: neuen SHA eintragen, PR.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          # Muss zu ERLAUBT_DEV in lib/pruefe-lizenzen.js passen; eine Änderung braucht ein ADR.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0,
            Unlicense, Python-2.0, MPL-2.0
          comment-summary-in-pr: never
