name: KI-Review

# #24, ADR-027: Ein PR ist erst mergebereit, wenn nach seinem letzten Commit ein KI-Review aus frischem
# Kontext mit „Ergebnis: freigegeben“ für genau diesen Stand vorliegt. Der Check ruft kein Sprachmodell
# auf; er liest nur PR-Kommentare und Reviews (scripts/ki-review-pruefen.js).
#
# Warum nur pull_request_review: Ein issue_comment-Lauf hängt am letzten Commit von main, nicht am PR; sein
# Ergebnis erscheint nicht im PR. Ein Review (auch „Comment“ auf den eigenen PR) startet den Check am
# Kopf-Commit des PRs, mit Leserechten. Einen pull_request-Lauf gibt es bewusst nicht: Sein rotes Ergebnis
# bliebe neben dem grünen des Reviews am selben Commit stehen und färbte den PR rot. Als Pflicht-Check steht
# `ki-review` ohne Review auf „Expected“ und sperrt den Merge; jeder neue Commit braucht ein neues Review.
# Ein gewöhnlicher PR-Kommentar zählt ebenfalls, braucht danach aber „Re-run“ des letzten Review-Laufs.
# ADR-030: Ändert der PR ADRs, Kapitel 1, 4, 5, 9 oder 10 der arc42-Doku (ARCHITEKTUR_PFADE im Skript), braucht
# das Review den Abschnitt „### Architektur (ATAM)“. Die geänderten Dateien liest der Check über pulls/{n}/files.
on:
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ki-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ki-review:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NR: ${{ github.event.pull_request.number }}
      KOPF_SHA: ${{ github.event.pull_request.head.sha }}
      # Konten, deren KI-Review zählt. Änderung nur per PR.
      KI_REVIEW_KONTEN: raifdmueller
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Kommentare und Reviews holen
        run: |
          gh api --paginate "repos/$REPO/issues/$NR/comments" \
            --jq '.[] | {autor: .user.login, zeit: .updated_at, text: (.body // "")}' > beitraege.jsonl
          gh api --paginate "repos/$REPO/pulls/$NR/reviews" \
            --jq '.[] | select(.submitted_at != null) | {autor: .user.login, zeit: .submitted_at, text: (.body // "")}' >> beitraege.jsonl
          jq -s . beitraege.jsonl > beitraege.json
          gh api --paginate "repos/$REPO/pulls/$NR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > dateien.txt
          echo "COMMIT_ZEIT=$(gh api "repos/$REPO/commits/$KOPF_SHA" --jq .commit.committer.date)" >> "$GITHUB_ENV"
      - name: KI-Review prüfen
        run: node scripts/ki-review-pruefen.js beitraege.json dateien.txt
