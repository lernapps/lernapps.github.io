name: Pages

# Builds the site into _site/, checks it, and on main publishes it to the gh-pages branch, which GitHub Pages
# serves at https://lernapps.net/. The same for every lernapps.net site: the steps are the shared
# actions in lernapps/tooling (npm ci, npm run build, npm run check; deploy to gh-pages without touching
# the previews). Renovate bumps the pinned commits.
#
# The change scope (lernapps/tooling changes.yml) gates the jobs: a change of only the plan (.vibe/**) runs nothing;
# docs (docs/**/*.md) and anything else build, check and deploy the site. The job `site` always runs and reports the
# result: the required check, which never stays "Pending".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    uses: lernapps/tooling/.github/workflows/changes.yml@cd842011daac56ec65ed94d14c402678600af375 # main
    with:
      tooling-ref: cd842011daac56ec65ed94d14c402678600af375 # the classifier of the same commit, and TOOLING_REF of the pre-push hook

  build: # builds and checks the site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: lernapps/tooling/actions/site-check@cd842011daac56ec65ed94d14c402678600af375 # main

  # The tests of the pre-push hook (npm test, test/pre-push.test.mjs); they need no install
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.site == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lernapps/tooling/actions/site-deploy@cd842011daac56ec65ed94d14c402678600af375 # main

  site: # required status check: always runs, fails when a job above failed or was cancelled
    needs: [changes, build, test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs ended: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
