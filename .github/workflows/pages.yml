name: Pages

# Baut die Site (Eleventy) und die Architektur-Doku (docToolchain) und liefert beide in EINEM Artefakt über
# GitHub Pages aus: Apps unter https://lernapps.github.io/, Doku unter https://lernapps.github.io/docs/.
# Pages-Quelle muss "GitHub Actions" sein. Achtung: Ein Repo <org>.github.io schaltet Pages beim Anlegen
# automatisch im Branch-Modus ein; umstellen mit
#   gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Java 17 für docToolchain v4
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # lib/ von docToolchain v4 entsteht per Gradle-Build (~120 MB Jars). Der Cache hängt am gepinnten
      # Commit; nur wenn DTC_SHA in scripts/dtc-v4.sh wechselt, baut CI lib/ neu. Refs docToolchain/docToolchain#1704
      - name: Gepinnten docToolchain-Commit ermitteln
        id: dtc
        run: |
          sha=$(sed -n 's/^DTC_SHA="\([0-9a-f]*\)"$/\1/p' scripts/dtc-v4.sh)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: docToolchain v4 und Gradle-Abhängigkeiten aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.doctoolchain/docToolchain-4.0.0-${{ steps.dtc.outputs.short }}
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: dtc-v4-${{ steps.dtc.outputs.sha }}
          restore-keys: dtc-v4-

      - name: Graphviz für PlantUML
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Architektur-Doku bauen (docToolchain)
        env:
          DTC_HEADLESS: "true"
        # docToolchain v4 ist noch nicht veröffentlicht: das Skript holt main-4.x am festen Commit.
        run: scripts/dtc-v4.sh generateSite

      - name: Doku nach _site/docs legen
        run: |
          mkdir -p _site/docs
          cp -r build/microsite/output/. _site/docs/
          # Die Vorlage der Startseite landet mit im Output; ausliefern soll man sie nicht.
          # Refs docToolchain/docToolchain#1703
          rm -f _site/docs/landingpage.gsp
          touch _site/.nojekyll
          find _site -maxdepth 1 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
