name: Prüfen

# Tests und Build (inkl. Build-Prüfungen) bei jedem Push und Pull Request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-und-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
