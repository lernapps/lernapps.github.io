name: Prüfen

# Tests und Build (inkl. Build-Prüfungen) bei jedem Push und Pull Request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-und-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Volle Abhängigkeitsliste prüfen, nicht --omit=dev: Die Site hat keine Laufzeit-Abhängigkeiten,
      # alles ist devDependency und läuft im Build, der das ausgelieferte HTML erzeugt (Supply Chain).
      - run: npm audit --audit-level=high
      - run: npm run lint
      # Typprüfung mit tsc --checkJs, vorerst nur src/kern (jsconfig.json, #25).
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
