name: Browser-Tests

# TD-5 (#26): Playwright-Tests gegen das gebaute _site/ – Smoke, externe Anfragen, 360 px, Übungsrunde, axe,
# "Zurück zu Claude", ohne JS. Eigener Workflow, damit der Pflicht-Check "test-und-build" (pruefen.yml) unverändert
# bleibt; läuft parallel dazu und baut selbst. Noch kein Pflicht-Check (Branch-Schutz: Check "browser" ergänzen).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Browser-Cache hängt an der gepinnten Playwright-Version; Systembibliotheken kommen immer per apt.
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium installieren
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx --package=@playwright/test playwright install --with-deps chromium
      - name: Systembibliotheken für Chromium
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx --package=@playwright/test playwright install-deps chromium

      - run: npm run test:browser
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-bericht
          path: |
            build/playwright/bericht/
            build/playwright/ergebnisse/
          retention-days: 14
